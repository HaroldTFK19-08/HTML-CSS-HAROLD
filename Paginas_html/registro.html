<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/registro.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <h1 style="text-align: center;">Inicio de sesion</h1>  
        <nav class="a">
            <a style="text-decoration: none; color: inherit;" href="/Paginas_html/inicio.html">Inicio Sesion</a>
            <a style="text-decoration: none; color: inherit;" href="/Paginas_html/registro.html">Registro</a>
        </nav>
    </header>
    <h2 style="text-align: center;">Formulario de registro</h2>
    <br><br>
        <form action="/Paginas_html/inicio.html" method="get" class="a">
            <label for="">Nombre</label>
            <br>
            <input type="text" required placeholder="Ingrese su nombre completo" minlength="1" maxlength="80">
            <br><br>
            <label for="">Identificacion</label>
            <br>
            <input type="number" required placeholder="Numero de Documento"  >
            <select name="" id="">
                <option value="" disabled> Tipo </option>
                <option value="">TI</option>
                <option value="">CC</option>
                <option value="">otros</option>
            </select>
            <br><br>
            <label for="">correo</label>
            <br>
            <input type="email" required placeholder="Ingrese el correo">
            <br><br>
            <label for="">Telefono</label>
            <br>
            <input type="tel"  required placeholder="Ingrese numero de Telefono" min="10" max="20"  >
            <br><br>
            <label for="">Direccion</label>
            <br>
            <input type="text" name="ciudad" placeholder="Ingrese ciudad" required>
            <br><br>
            <input type="text" name="departamento" placeholder="Ingrese departamento" required>
            <br><br>
            <input type="text" name="Calle" placeholder="Ingrese Direccion" required>
            <br><br>
            <input type="date" required> Fecha Nacimiento
            <br><br>
            <label for="">edad</label>
            <br>
            <input type="number"   placeholder="Edad" required>
            <br><br>
            <label for="">Genero</label>
            <br>
            <input type="radio">Hombre
            <input type="radio">Mujer
            <input type="checkbox">otro...
            <br><br>
            <h3>Preferencias de Deportes</h3>
            <label for="">Que clase de deportes te gustan?</label>
            <select name="" id="" required>
                <option value="" disabled> Videojuegos </option>
                <option value="">Futbol</option>
                <option value="">Baloncesto</option>
                <option value="">Tenis</option> 
                <option value="">Voley</option>
            </select>
            <br><br>
            <button type="submit">Registrarse</button>
        </form>
        <br>
        <footer class="footer">
            <br>
            <div >
                <h3>Deportes</h3>
                <p>Harold Chantre</p>
                <p>Derechos Reservados &copy;2026</p>
            </div>
            <br>
        </footer>
</body>
</html>
